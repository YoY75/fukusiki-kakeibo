let drillCat = '', drillType = 'exp';
let editingEntryId = null;

function openDrill(cat, type) {
  drillCat  = cat;
  drillType = type;
  document.getElementById('drillIcon').textContent  = acctIcon(cat);
  document.getElementById('drillIcon').style.background = acctColor(cat)+'22';
  document.getElementById('drillTitle').textContent = cat;
  renderDrillList();
  document.getElementById('drillOverlay').classList.add('open');
  document.getElementById('drillPanel').classList.add('open');
  // prevent body scroll
  document.body.style.overflow = 'hidden';
}

function closeDrill() {
  document.getElementById('drillOverlay').classList.remove('open');
  document.getElementById('drillPanel').classList.remove('open');
  document.body.style.overflow = '';
  editingEntryId = null;
}

function renderDrillList() {
  // Filter entries for this category within statsMonth
  const periodEs = getPeriodEntries();
  const drillEntries = periodEs.filter(e =>
    e.type !== 'secval' && e.debit === drillCat
  ).sort((a,b) => b.date.localeCompare(a.date));

  const total = drillEntries.reduce((s,e) => s+e.amount, 0);
  document.getElementById('drillTotal').textContent = fmt(total);

  const el = document.getElementById('drillList');
  if (!drillEntries.length) {
    el.innerHTML = '<div style="text-align:center;padding:30px 0;color:var(--text3);font-size:13px">この月の取引はありません</div>';
    return;
  }

  el.innerHTML = drillEntries.map(e => {
    const {txt: payTxt} = payLabel(e);
    const debitDisp = e.debitPath ? e.debitPath.join(' › ') : e.debit;
    const isEditing = editingEntryId === e.id;
    const editForm = isEditing ? buildEditForm(e) : '';
    return `<div class="drill-entry" id="dentry_${e.id}" onclick="toggleEditForm(${e.id}, event)">
      <div class="drill-entry-left">
        <div class="drill-entry-desc">${e.desc}</div>
        <div class="drill-entry-sub">${debitDisp} → ${e.credit}　${payTxt}</div>
        ${e.memo ? '<div class="drill-entry-memo">📝 '+escHtmlDrill(e.memo)+'</div>' : ''}
        ${editForm}
      </div>
      <div class="drill-entry-right">
        <div class="drill-entry-amount">-${fmt(e.amount)}</div>
        <div class="drill-entry-date">${e.date}</div>
        <div class="drill-entry-actions">
          <button class="btn-sm" style="padding:3px 8px;font-size:10px" onclick="startEdit(${e.id},event)">✏️ 編集</button>
          <button class="btn-sm btn-danger" style="padding:3px 8px;font-size:10px" onclick="deleteFromDrill(${e.id},event)">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtmlDrill(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleEditForm(id, e) { e.stopPropagation(); }

function startEdit(id, ev) {
  ev.stopPropagation();
  editingEntryId = (editingEntryId === id) ? null : id;
  renderDrillList();
  if (editingEntryId) {
    setTimeout(() => {
      const el = document.getElementById('ef_desc_'+id);
      if (el) el.focus();
    }, 50);
  }
}

function buildEditForm(e) {
  return `<div class="edit-form" onclick="event.stopPropagation()">
    <div class="edit-form-title">✏️ 編集</div>
    <div class="field">
      <label class="field-label" style="font-size:9px">日付</label>
      <input class="edit-field-inline" type="date" id="ef_date_${e.id}" value="${e.date}">
    </div>
    <div class="field">
      <label class="field-label" style="font-size:9px">摘要</label>
      <input class="edit-field-inline" id="ef_desc_${e.id}" value="${escHtmlDrill(e.desc)}" placeholder="摘要">
    </div>
    <div class="field">
      <label class="field-label" style="font-size:9px">金額</label>
      <div class="edit-amount-wrap">
        <span class="edit-amount-pfx">¥</span>
        <input class="edit-field-inline" type="number" id="ef_amt_${e.id}" value="${e.amount}" inputmode="numeric" style="padding-left:22px;font-family:'DM Mono',monospace">
      </div>
    </div>
    <div class="field">
      <label class="field-label" style="font-size:9px">メモ</label>
      <input class="edit-field-inline" id="ef_memo_${e.id}" value="${escHtmlDrill(e.memo||'')}" placeholder="メモ（任意）">
    </div>
    <div class="edit-form-row">
      <button class="btn-sm" onclick="cancelEdit(event)">キャンセル</button>
      <button class="btn-sm btn-add" onclick="saveEdit(${e.id},event)">💾 保存</button>
    </div>
  </div>`;
}

function cancelEdit(ev) {
  ev.stopPropagation();
  editingEntryId = null;
  renderDrillList();
}

function saveEdit(id, ev) {
  ev.stopPropagation();
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const newDate = document.getElementById('ef_date_'+id).value;
  const newDesc = document.getElementById('ef_desc_'+id).value.trim();
  const newAmt  = parseInt(document.getElementById('ef_amt_'+id).value);
  const newMemo = document.getElementById('ef_memo_'+id).value.trim();
  if (!newDate || !newDesc || !newAmt || newAmt <= 0) {
    showToast('⚠️ 日付・摘要・金額を入力してください','#ff5e7e'); return;
  }
  e.date   = newDate;
  e.desc   = newDesc;
  e.amount = newAmt;
  e.memo   = newMemo;
  save(SK.entries, entries);
  editingEntryId = null;
  renderDrillList();
  renderAll();
  showToast('✅ 保存しました');
}

function deleteFromDrill(id, ev) {
  ev.stopPropagation();
  if (!confirm('この取引を削除しますか？')) return;
  entries = entries.filter(e => e.id !== id);
  save(SK.entries, entries);
  renderDrillList();
  renderAll();
  showToast('🗑 削除しました','#ff5e7e');
}

    // Inline SW as Blob so it works even without a separate sw.js file
    const swCode = `
const CACHE = 'kakeibo-v2';
const ASSETS = ['./kakeibo.html','./manifest.json'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => {
    return Promise.allSettled(ASSETS.map(a => c.add(a).catch(()=>{})));
  }).then(() => self.skipWaiting()));
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys()
      .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});
self.addEventListener('fetch', e => {
  const url = new URL(e.request.url);
  // Skip non-GET and chrome-extension requests
  if (e.request.method !== 'GET' || url.protocol === 'chrome-extension:') return;
  // Fonts: network first, fallback to cache
  if (url.hostname.includes('fonts.googleapis.com') || url.hostname.includes('fonts.gstatic.com')) {
    e.respondWith(
      fetch(e.request)
        .then(res => { caches.open(CACHE).then(c => c.put(e.request, res.clone())); return res; })
        .catch(() => caches.match(e.request))
    );
    return;
  }
  // App files: cache first, fallback to network
  e.respondWith(
    caches.match(e.request).then(cached => {
      if (cached) return cached;
      return fetch(e.request).then(res => {
        if (res && res.status === 200) {
          caches.open(CACHE).then(c => c.put(e.request, res.clone()));
        }
        return res;
      }).catch(() => cached);
    })
  );
});
`;
    try {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl)
        .then(reg => {
          console.log('SW registered (inline blob)');
          // Also try registering external sw.js for GitHub Pages deployment
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        })
        .catch(err => console.log('SW blob registration failed:', err));
    } catch(e) {
      // Fallback: try external file (works on GitHub Pages)
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW registered (external)'))
        .catch(err => console.log('SW not available:', err));
    }
  });
}

// Capture install prompt event
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show banner after 2s if not already installed
  setTimeout(() => {
    const banner = document.getElementById('pwaBanner');
    if (banner) banner.style.display = 'flex';
  }, 2000);
});

function installPWA() {
  const banner = document.getElementById('pwaBanner');
  if (banner) banner.style.display = 'none';
  if (!deferredInstallPrompt) {
    // iOS: show instructions
    showToast('ブラウザの「共有」→「ホーム画面に追加」をタップ');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(result => {
    if (result.outcome === 'accepted') showToast('✅ ホーム画面に追加しました！');
    deferredInstallPrompt = null;
  });
}

// Hide banner once installed
window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('pwaBanner');
  if (banner) banner.style.display = 'none';
  deferredInstallPrompt = null;
});

// Offline/online status toast
window.addEventListener('offline', () => showToast('📵 オフラインです（データは保存済み）', '#f5c542'));
window.addEventListener('online',  () => showToast('✅ オンラインに戻りました'));

</script>
